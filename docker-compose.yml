# ============================================================================
# Базовый стек. Dev-переопределения — в docker-compose.override.yml
# ============================================================================
name: 3snet-deletion

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: 3snet-php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      DATABASE_URL: "mysql://app:secret@mysql:3306/app?serverVersion=8.0.36&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      XDEBUG_TRIGGER: "${XDEBUG_TRIGGER:-}"
    networks:
      - 3snet

  nginx:
    image: nginx:1.27-alpine
    container_name: 3snet-nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - 3snet

  mysql:
    image: mysql:8.0.36
    container_name: 3snet-mysql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - 3snet

  redis:
    image: redis:7.2-alpine
    container_name: 3snet-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - 3snet

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: 3snet-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1026}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - 3snet

volumes:
  mysql_data:
  redis_data:

networks:
  3snet:
    driver: bridge