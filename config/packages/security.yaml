security:
    providers:
        in_memory:
            memory:
                users:
                    api:
                        password: '%env(API_USER_PASSWORD)%'
                        roles: ['ROLE_API_USER']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            http_basic:
                provider: in_memory

    # access_control УДАЛЁН — защита через #[IsGranted] в контроллере.
    # Если появятся публичные /api-эндпоинты — вернем блок точечно


# Пароли хешируются как plaintext только в dev/test (placeholder из .env).
# В prod — 'auto'; значение API_USER_PASSWORD тогда ДОЛЖНО быть хешем,
# сгенерированным через: php bin/console security:hash-password
# Иначе пользователь не сможет аутентифицироваться (fail-closed).
when@dev:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser: 'plaintext'

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser: 'plaintext'

when@prod:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: 'auto'
                cost: 13
