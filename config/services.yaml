parameters:

services:
    # _defaults configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Deletion/Domain/ValueObject/'
            - '../src/Deletion/Domain/Model/'
            - '../src/Deletion/Domain/Exception/'
            - '../src/Deletion/Domain/Repository/'
            - '../src/Deletion/Attribute/'

    # ---------------------------------------------------------------------
    # Настройка модуля Deletion (Dependency Injection)
    # ---------------------------------------------------------------------

    # 1. Связываем интерфейсы (Порты) с реализациями (Адаптерами)
    App\Deletion\Domain\Repository\RelationMetadataRepositoryInterface:
        alias: App\Deletion\Infrastructure\Doctrine\Repository\DoctrineRelationMetadataRepository

    App\Deletion\Domain\Repository\DeletionEntityRepositoryInterface:
        alias: App\Deletion\Infrastructure\Doctrine\Repository\DoctrineDeletionEntityRepository

    App\Deletion\Domain\Service\RelationActionResolverInterface:
        alias: App\Deletion\Infrastructure\Attribute\RelationActionResolver

    # 2. Скалярный параметр для Doctrine-репозитория
    App\Deletion\Infrastructure\Doctrine\Repository\DoctrineDeletionEntityRepository:
        arguments:
            $softDeleteField: 'deletedAt'
