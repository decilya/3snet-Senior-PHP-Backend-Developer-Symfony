parameters:

services:
    # _defaults configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Исключаем классы, которые не являются сервисами (VO, модели, атрибуты)
            - '../src/Deletion/Domain/ValueObject/'
            - '../src/Deletion/Domain/Model/'
            - '../src/Deletion/Domain/Exception/'
            - '../src/Deletion/Domain/Repository/'
            - '../src/Deletion/Attribute/'

    # ---------------------------------------------------------------------
    # Настройка модуля Deletion (Dependency Injection)
    # ---------------------------------------------------------------------

    # 1. Связываем интерфейсы (Порты) с реализациями (Адаптерами)
    App\Deletion\Domain\Repository\RelationMetadataRepositoryInterface:
        '@App\Deletion\Infrastructure\Doctrine\Repository\DoctrineRelationMetadataRepository'

    App\Deletion\Domain\Repository\DeletionEntityRepositoryInterface:
        '@App\Deletion\Infrastructure\Doctrine\Repository\DoctrineDeletionEntityRepository'

    # 2. Передаем Резолвер в Планировщик
    App\Deletion\Domain\Service\DeletionPlanner:
        arguments:
            $actionResolver: '@App\Deletion\Application\Service\RelationActionResolver'

    # 3. Параметры для репозитория Doctrine
    App\Deletion\Infrastructure\Doctrine\Repository\DoctrineDeletionEntityRepository:
        arguments:
            $softDeleteField: 'deletedAt'
