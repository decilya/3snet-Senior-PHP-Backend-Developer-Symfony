; ============================================================================
; Xdebug — режим "по требованию" (trigger-based)
; ============================================================================
xdebug.mode = develop,debug,coverage
xdebug.start_with_request = trigger     ; запуск только по XDEBUG_TRIGGER=1
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
xdebug.max_nesting_level = 512

; Покрытие — только если запущено через XDEBUG_MODE=coverage