; ============================================================================
; Общие настройки PHP для dev/prod
; ============================================================================
date.timezone = UTC
default_charset = "UTF-8"
memory_limit = 512M
max_execution_time = 60
post_max_size = 64M
upload_max_filesize = 64M

; --- Ошибки: в dev переопределяются через Xdebug/var_dump, в prod — логи ---
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; --- OPcache (в dev отключаем через override) ---
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
;opcache.jit = tracing
;opcache.jit_buffer_size = 128M
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; --- Сессии (для админки, если понадобится) ---
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.save_handler = redis
; session.save_path переопределяется через env в override

; --- Безопасность ---
expose_php = Off
