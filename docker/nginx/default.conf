# ============================================================================
# Nginx для Symfony (public/index.php)
# ============================================================================
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Проксируем только существующие файлы (иначе — index.php)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS off;
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        internal;  # защита от прямого обращения к /index.php
    }

    # Любой другой .php — 404 (никаких shell-скриптов)
    location ~ \.php$ {
        return 404;
    }

    # Xdebug: пробрасываем cookie в заголовке X-Request-ID
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    client_max_body_size 64M;
}