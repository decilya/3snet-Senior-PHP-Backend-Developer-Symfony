services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Shared\Deletion\Middleware\DeletionMiddlewareInterface:
            tags: ['deletion.middleware']

    # 1. Реализация MetricsRecorderInterface (лог)
    Shared\Deletion\Metrics\MetricsRecorderInterface:
        class: Shared\Deletion\Metrics\LogMetricsRecorder

    # 2. Оригинальный оркестратор (переименовываем, чтобы освободить FQCN)
    Shared\Deletion\Service\DeletionOrchestrator.original:
        class: Shared\Deletion\Service\DeletionOrchestrator
        arguments:
            $middlewares: !tagged_iterator deletion.middleware

    # 3. Наш Wrapper (принимает оригинал и middleware)
    Shared\Deletion\Service\DeletionOrchestratorWrapper:
        arguments:
            $inner: '@Shared\Deletion\Service\DeletionOrchestrator.original'
            $middlewares: !tagged_iterator deletion.middleware

    # 4. Алиас: при запросе DeletionOrchestrator возвращаем Wrapper
    Shared\Deletion\Service\DeletionOrchestrator:
        alias: Shared\Deletion\Service\DeletionOrchestratorWrapper